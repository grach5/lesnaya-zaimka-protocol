# CMS-панель редактирования (Decap CMS) — открывается по адресу /admin/
# на сайте. Технически всё готово к работе; чтобы панель заработала, нужен
# ОДИН оставшийся шаг — авторизация через GitHub App (без сервера-посредника,
# без затрат):
#
# 1. GitHub → Settings → Developer settings → GitHub Apps → New GitHub App
# 2. Homepage URL: https://grach5.github.io/lesnaya-zaimka-protocol/
#    Callback URL: https://grach5.github.io/lesnaya-zaimka-protocol/admin/
#    Разрешения (Repository permissions): Contents — Read and write
# 3. Установите приложение на репозиторий grach5/lesnaya-zaimka-protocol
# 4. Скопируйте "Client ID" приложения и вставьте ниже вместо app_id
#
# После этого на /admin/ можно будет войти через GitHub-аккаунт и редактировать
# меню и контакты — изменения сохраняются напрямую в этот репозиторий и сайт
# пересоберётся автоматически (тот же процесс, что при обычном git push).

backend:
  name: github
  repo: grach5/lesnaya-zaimka-protocol
  branch: master
  auth_type: pkce
  app_id: "REPLACE_WITH_GITHUB_APP_CLIENT_ID"

site_url: https://grach5.github.io/lesnaya-zaimka-protocol/
display_url: https://grach5.github.io/lesnaya-zaimka-protocol/
logo_url: /lesnaya-zaimka-protocol/img/brand/logo.png

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

locale: "ru"

collections:
  - name: "menu"
    label: "Меню ресторана"
    files:
      - name: "menu"
        label: "Меню (все разделы)"
        file: "src/data/menu.json"
        fields:
          - label: "Разделы меню"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Название раздела", name: "name", widget: "string" }
              - label: "Блюда"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}} ₽"
                fields:
                  - { label: "Название блюда", name: "name", widget: "string" }
                  - { label: "Цена, ₽", name: "price", widget: "number", value_type: "int" }

  - name: "contacts"
    label: "Контакты"
    files:
      - name: "contacts"
        label: "Контакты ресторана"
        file: "src/data/contacts.json"
        fields:
          - { label: "Название", name: "name", widget: "string" }
          - { label: "Адрес", name: "address", widget: "string" }
          - { label: "Телефон (бронь стола)", name: "phoneTable", widget: "string", hint: "Формат: +7 (423) 293-11-33 — используется и для WhatsApp-ссылки" }
          - { label: "Телефон (банкетный отдел)", name: "phoneEvents", widget: "string" }
          - { label: "Часы работы", name: "hours", widget: "string" }
          - { label: "Название отеля-партнёра", name: "hotelName", widget: "string" }
          - { label: "Сайт отеля-партнёра", name: "hotelUrl", widget: "string" }
          - { label: "Широта (lat)", name: "lat", widget: "number", value_type: "float" }
          - { label: "Долгота (lon)", name: "lon", widget: "number", value_type: "float" }

  - name: "halls"
    label: "Залы"
    files:
      - name: "halls"
        label: "Банкетные залы"
        file: "src/data/halls.json"
        fields:
          - label: "Залы"
            name: "halls"
            widget: "list"
            summary: "{{fields.name}} — {{fields.capacity}}"
            fields:
              - { label: "Название зала", name: "name", widget: "string" }
              - { label: "Описание (этаж, оснащение)", name: "description", widget: "text" }
              - { label: "Вместимость", name: "capacity", widget: "string", hint: "Например: 200–250 чел или до 500 чел" }
              - { label: "Площадь", name: "area", widget: "string", required: false, hint: "Например: 400 м² — можно оставить пустым" }
              - { label: "Технические поля — не трогать", name: "slug", widget: "hidden" }
              - { label: "Технические поля — не трогать", name: "photoCount", widget: "hidden" }
          - label: "Форматы мероприятий (список на странице «Мероприятия»)"
            name: "eventFormats"
            widget: "list"
            field: { label: "Формат", name: "format", widget: "string" }

  - name: "history"
    label: "История"
    files:
      - name: "history"
        label: "Хронология и цитаты"
        file: "src/data/history.json"
        fields:
          - label: "Записи хроники"
            name: "entries"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "Год", name: "year", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "body", widget: "text" }
          - label: "Цитата владельца"
            name: "ownerQuote"
            widget: "object"
            fields:
              - { label: "Текст цитаты", name: "text", widget: "text" }
              - { label: "Автор", name: "author", widget: "string" }
              - { label: "Должность/роль", name: "role", widget: "string" }
          - label: "Цитаты почётных гостей"
            name: "guestQuotes"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Текст цитаты", name: "text", widget: "text" }
              - { label: "Автор", name: "author", widget: "string" }
              - { label: "Должность/роль", name: "role", widget: "string" }

  - name: "reviews"
    label: "Отзывы"
    files:
      - name: "reviews"
        label: "Отзывы гостей"
        file: "src/data/reviews.json"
        fields:
          - label: "Отзывы"
            name: "reviews"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Автор", name: "author", widget: "string" }
              - { label: "Текст отзыва", name: "text", widget: "text" }
              - { label: "Короткая пометка (необязательно)", name: "highlight", widget: "string", required: false }

  - name: "carwash"
    label: "Автомойка"
    files:
      - name: "carwash"
        label: "Категории услуг"
        file: "src/data/carwash.json"
        fields:
          - label: "Категории"
            name: "categories"
            widget: "list"
            field: { label: "Категория", name: "category", widget: "string" }

  - name: "events-board"
    label: "Афиша"
    files:
      - name: "events-board"
        label: "Предстоящие события"
        file: "src/data/events-board.json"
        fields:
          - label: "События"
            name: "events"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Название события", name: "title", widget: "string" }
              - { label: "Дата", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Описание", name: "description", widget: "text", required: false }
              - { label: "Фото афиши", name: "image", widget: "image", required: false }
